<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет учёта — Займемся Спортом</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="landing">
  <div class="wrap landing-wrap">
    <p class="eyebrow">ДСК «Займемся Спортом»</p>
    <h1>Кабинет учёта</h1>
    <p class="lead">Введите логин и пароль личного кабинета.</p>
    <form class="login-box" id="login">
      <label class="field">Логин
        <input name="login" autocomplete="username" required>
      </label>
      <label class="field">Пароль
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="warn-text hidden" id="login-err"></p>
      <button class="btn" type="submit">Войти</button>
    </form>
  </div>
  <script src="js/landing.js"></script>
</body>
</html>
